name: CI

on:
  pull_request:
    # PR #67 is stacked on the delivery-evidence branch before integration.
    branches: [develop, main, feature/m8-t2-postmark-webhook-auth, feature/m8-provider-health-foundation]
  push:
    branches: [develop]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate Composer
        run: composer validate --no-check-publish --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHP syntax
        run: composer lint:php
      - name: WordPress Coding Standards
        run: composer lint:wpcs
      - name: Unit tests
        run: composer test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Admin interface checks
        run: |
          node --check assets/js/admin.js
          node --test tests/js/admin.test.cjs
